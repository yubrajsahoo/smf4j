<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SMF4J Benchmark Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        .btn { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .btn-jmh { background-color: #007bff; }
        .btn-gatling { background-color: #28a745; }
        .btn-report { background-color: #6c757d; }
        #status { margin-top: 20px; font-weight: bold; }
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <h1>SMF4J Benchmark Dashboard</h1>
    <p>Use the buttons below to trigger the performance tests.</p>

    <button class="btn btn-jmh" onclick="runTest('jmh')">Run JMH Microbenchmark</button>
    <button class="btn btn-gatling" onclick="runTest('gatling')">Run Gatling Load Test</button>
    <br/><br/>
    <a href="/report"><button class="btn btn-report">View Reports</button></a>

    <div class="loader" id="loader"></div>
    <div id="status"></div>
</div>

<script>
    function runTest(type) {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('status').innerText = 'Running ' + type + ' test... Please wait.';
        
        fetch('/api/benchmark/' + type, { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                if(data.status === 'success') {
                    document.getElementById('status').innerText = 'Success! ' + data.message;
                } else {
                    document.getElementById('status').innerText = 'Error: ' + data.message;
                }
            })
            .catch(error => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status').innerText = 'An error occurred while running the test.';
                console.error(error);
            });
    }
</script>
</body>
</html>
