name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Grant execute permission for mvnw
      run: chmod +x ./mvnw
        
    - name: Build with Maven
      run: ./mvnw -B clean verify
      
    - name: Analyze with SonarCloud
      # Only run SonarCloud analysis if the token is available (e.g., not on forks)
      if: env.SONAR_TOKEN != ''
      run: ./mvnw -B sonar:sonar -Dsonar.projectKey=yubrajsahoo_smf4j -Dsonar.organization=yubrajsahoo -Dsonar.host.url=https://sonarcloud.io
